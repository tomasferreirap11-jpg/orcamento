  F = mode === 'edit'
    ? { mode, id:e.id, amt:num(e.cents).replace(/\./g, ''), desc:e.desc, cat:e.category, catManual:true, date:e.date }
    : { mode: S.sim.on ? 'sim' : 'add', amt:'', desc:'', cat:'Outros', catManual:false, date:defaultDate() };
  const [min, max] = monthBounds();
  const y = new Date(); y.setDate(y.getDate() - 1);
  const quick = S.month === TODAY_MONTH ? [['Hoje', TODAY], ['Ontem', ymd(y)]].filter(q => q[1] >= min) : [];
  const title = F.mode === 'edit' ? 'Editar despesa' : F.mode === 'sim' ? 'Despesa simulada' : 'Nova despesa';
  openSheet(`
    <div class="sheet-h"><button data-act="close">Cancelar</button><b>${title}</b><button style="visibility:hidden" aria-hidden="true" tabindex="-1">Cancelar</button></div>
    <div class="amount" id="fAmt"></div>
    <div class="amount-cap">${F.mode === 'sim' ? 'Não fica gravada' : monthLabel(S.month)}</div>
    <span class="lbl">Descrição</span>
    <input class="field" id="fDesc" maxlength="100" value="${esc(F.desc)}" autocomplete="off" enterkeyhint="done">
    <span class="lbl">Categoria</span>
    <div class="cats">${CATS.map(c => `<button class="cat-pick" data-pick="${esc(c)}" style="--c:${CAT[c].c}">${icon(c, 'sm')}${esc(c)}</button>`).join('')}${addCatBtn}</div>
    ${F.mode !== 'sim' ?`<span class="lbl">Data</span>
    <div class="dates">${quick.map(q => `<button class="pill" data-date="${q[1]}">${q[0]}</button>`).join('')}
      <input type="date" class="date-in" id="fDate" min="${min}" max="${max}" value="${F.date}" aria-label="Data"></div>` : ''}
    <div class="keypad">${['1','2','3','4','5','6','7','8','9',',','0','del'].map(k => `<button class="key" data-key="${k}" aria-label="${k === 'del' ? 'Apagar' : k}">${k === 'del' ? '<svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>' : k}</button>`).join('')}</div>
    <button class="btn ${F.mode === 'sim' ? 'hyp' : 'primary'}" id="fGo" data-act="submit"></button>
    ${F.mode === 'edit' ? `<button class="linkbtn" style="color:var(--bad)" data-act="del">Eliminar despesa</button>` : ''}`);
  updateForm();
}
function formCents(){ return F.amt ? parseAmount(F.amt) : null; }
function updateForm(){
  if (!F) return;
  const a = $('#fAmt'), c = formCents();
  a.textContent = F.amt ? F.amt.replace(/\B(?=(\d{3})+(?!\d))/, m => m) + ' €' : '0,00 €';
  if (F.amt){ const [i, d] = F.amt.split(','); a.textContent = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (d != null ? ',' + d : '') + ' €'; }
  a.classList.toggle('zero', !F.amt);
  document.querySelectorAll('.cat-pick').forEach(b => b.classList.toggle('on', b.dataset.pick === F.cat));
  document.querySelectorAll('.pill[data-date]').forEach(b => b.classList.toggle('on', b.dataset.date === F.date));
  const go = $('#fGo');
  const verb = F.mode === 'edit' ? 'Guardar' : F.mode === 'sim' ? 'Simular' : 'Adicionar';
  go.textContent = c ? verb + ' ' + eur(c) : verb;
  go.disabled = !c;
}
function pressKey(k){
  if (!F) return;
  let a = F.amt;
  if (k === 'del') a = a.slice(0, -1);
  else if (k === ','){ if (!a.includes(',')) a = (a || '0') + ','; }
  else {
    const [i, d] = a.split(',');
    if (d != null){ if (d.length < 2) a += k; }
    else if (i.length < 7) a = (a === '0' ? '' : a) + k;
  }
  F.amt = a; buzz(); updateForm();
}

async function submitForm(btn){
  const cents = formCents(); if (!cents) return;
  const desc = ($('#fDesc').value.trim() || F.cat).slice(0, 100);
  if (F.mode === 'sim'){ S.sim.extra.push({ desc, cents }); closeSheet(); render(); return; }
  const date = $('#fDate') && $('#fDate').value ? $('#fDate').value : F.date;
  if (F.mode === 'edit'){
    btn.disabled = true;
    try {
      const r = await call('updateExpense', { id:F.id, desc, cents, category:F.cat, date });
      const e = S.data.expenses.find(x => x.id === r.id); if (e) Object.assign(e, r);
      closeSheet(); render(); toast('Despesa corrigida'); refreshOthers();
    } catch (err) { btn.disabled = false; toast(err.message); }
    return;
  }
  const item = { month:S.month, date, desc, cents, category:F.cat };
  closeSheet(); buzz();
  addItems([item]);
}

async function addItems(items){
  const month = S.month;
  const temps = items.map((it, i) => Object.assign({ id:'tmp' + Date.now() + i, pending:true }, it));
  S.data.expenses.push(...temps); render();
  try {
    const saved = await call('addExpenses', { items });
    if (S.data && S.data.month === month){ S.data.expenses = S.data.expenses.filter(e => !temps.includes(e)).concat(saved); render(); }
    toast(saved.length === 1 ? saved[0].desc + ' · ' + eur(saved[0].cents) : saved.length + ' despesas registadas');
    refreshOthers();
    return true;
  } catch (e) {
    if (S.data && S.data.month === month){ S.data.expenses = S.data.expenses.filter(x => !temps.includes(x)); render(); }
    toast('Não gravado: ' + e.message);
    return false;
  }
}

async function deleteExp(btn){
  if (btn.dataset.confirm !== '1'){ btn.dataset.confirm = '1'; btn.textContent = 'Tocar de novo para eliminar'; return; }
  btn.disabled = true;
  const id = F.id;
  try { await call('deleteExpense', { id }); S.data.expenses = S.data.expenses.filter(x => x.id !== id); closeSheet(); render(); toast('Despesa eliminada'); refreshOthers(); }
  catch (err) { btn.disabled = false; toast(err.message); }
}

async function saveSettings(btn){
  const month = F.month, year = +month.slice(0, 4);
  const gt = $('#sGoal') ? $('#sGoal').value.trim() : null;
  const goal = gt == null ? null : gt === '' || /^0+([.,]0*)?$/.test(gt) ? 0 : parseAmount(gt);
  if (gt != null && (goal == null || goal < 0)) return toast('Objetivo inválido.');
  let bud = null, def = false;
  if ($('#sBud')){
    const bt = $('#sBud').value.trim();
    bud = /^0+([.,]0*)?$/.test(bt) ? 0 : parseAmount(bt);
    if (bud == null || bud < 0) return toast('Orçamento inválido.');
    def = $('#sDef').checked;
  }
  btn.disabled = true;
  try {
    if (bud != null && (bud !== S.data.budget || (def && bud !== S.data.defaultBudget))) await call('setBudget', { month, cents:bud, makeDefault:def });
    if (gt != null && goal !== S.yearData.goal) await call('setGoal', { year, cents:goal });
    if (F.color !== F.colorOrig) { await call('setConfig', { key:'corApp', value:F.color }); applyAppColor(F.color, true); }
    F.saved = true; closeSheet(); toast('Guardado'); load(); refreshOthers();
  } catch (e) { btn.disabled = false; toast(e.message); }
}

  view = view || S.view;

  if (view === 'newfund'){
    out.innerHTML = `<section class="hero newfund" data-act="newFund" role="button" aria-label="Criar novo fundo">

  }

  if (!f){ out.innerHTML = ''; return; }
  const list = d.moves.filter(m => m.fund === f.id);
  const groups = {}; list.forEach(m => { const k = m.date.slice(0, 7); (groups[k] = groups[k] || []).push(m); });
  const movesHtml = Object.keys(groups).sort().reverse().map(k => `<div class="group"><div class="day">${monthLabel(k)}</div><div class="txs">${groups[k].map(m => `

  </section>

}

    };

    return name => {
      const r = snap.id ? Object.assign({}, S.recData.items.find(x => x.id === snap.id)) : null;

/* ---------- despesas recorrentes ---------- */
const dayLabelShort = day => MESES[+day.slice(0, 2) - 1];
function renderRec(){
  const all = S.recData.items, funds = S.recData.funds || [];
  const fundName = id => { const f = funds.find(x => x.id === id); return f ? f.name : 'Orçamento do mês'; };
  const bigNum = v => `<div class="num" style="font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.02em;margin-top:6px">${eur(v)}</div>`;
  const section = (items, freq) => {
    const act = items.filter(r => r.active), total = act.reduce((s, r) => s + r.cents, 0);
    const sorted = freq === 'anual' ? act.slice().sort((a, b) => a.day.localeCompare(b.day)) : act;
    const row = r => `
      <button class="tx ${r.active ? '' : 'off'}" data-rec="${esc(r.id)}">${icon(r.category)}
        <div class="tx-main"><b>${esc(r.desc)}</b><small>${freq === 'anual' ? dayLabelShort(r.day) + ' · ' + esc(fundName(r.fund)) : esc(r.category)}${r.active ? '' : ' · em pausa'}</small></div>
        <span class="amt num">${eur(r.cents)}</span></button>`;
    return `
  <section class="card">
    <div class="card-h"><h3>${freq === 'anual' ? 'Total por ano' : 'Total por mês'}</h3><span class="hint" style="margin:0">${act.length} ${act.length === 1 ? 'despesa' : 'despesas'}</span></div>
    ${bigNum(total)}
  </section>
  ${items.length ? `<div class="group"><div class="txs">${sorted.map(row).join('')}${items.filter(r => !r.active).map(row).join('')}</div></div>` : ''}
  <button class="btn primary inline" data-act="${freq === 'anual' ? 'addRecY' : 'addRec'}" style="margin:4px auto 0;display:block">${freq === 'anual' ? 'Adicionar anual' : 'Adicionar mensal'}</button>`;
  };
  $('#view').innerHTML = `
  <div class="sh" style="margin-top:0"><h2>Mensais</h2></div>
  ${section(all.filter(r => r.freq !== 'anual'), 'mensal')}
  <div class="sh"><h2>Anuais</h2></div>
  ${section(all.filter(r => r.freq === 'anual'), 'anual')}`;
}
function openRec(r, freq){
  const isNew = !r;
  r = r || { desc:'', cents:0, category: freq === 'anual' ? 'Outros' : 'Subscrições', active:true, freq: freq || 'mensal', day:'', fund:'' };
  const funds = (S.recData && S.recData.funds) || [];
  F = { mode:'rec', id:r.id || null, cat:r.category, active:r.active, freq:r.freq || 'mensal', fund:r.fund || '', rmonth: r.day ? r.day.slice(0, 2) : '' };
  openSheet(`
    <div class="sheet-h"><button data-act="close">Cancelar</button><b>${isNew ? 'Nova recorrente' : 'Editar recorrente'}</b><button data-act="saveRec" style="color:var(--accent);font-weight:700">Guardar</button></div>
    <div class="seg"><button data-freq="mensal">Mensal</button><button data-freq="anual">Anual</button></div>
    <span class="lbl">Descrição</span>
    <input class="field" id="rDesc" maxlength="100" value="${esc(r.desc)}" autocomplete="off">
    <span class="lbl" id="rValLbl">Valor</span>
    <input class="field num" id="rVal" inputmode="none" readonly data-kpf value="${r.cents ? num(r.cents) : ''}" autocomplete="off">
    <div id="rYear">
      <span class="lbl">Mês</span>
      <div class="months-pick">${MES_C.map((m, i) => `<button class="pill" data-rmonth="${pad(i + 1)}">${m}</button>`).join('')}</div>
      <span class="lbl">Pago com</span>
      <div class="pills"><button class="pill" data-pay="">Orçamento do mês</button>${funds.map(f => `<button class="pill" data-pay="${esc(f.id)}"><i class="fund-dot" style="--c:${f.color}"></i>${esc(f.name)}</button>`).join('')}</div>
    </div>
    <span class="lbl">Categoria</span>
    <div class="cats">${CATS.map(c => `<button class="cat-pick ${c === F.cat ? 'on' : ''}" data-pick="${esc(c)}" style="--c:${CAT[c].c}">${icon(c, 'sm')}${esc(c)}</button>`).join('')}${addCatBtn}</div>
    ${isNew ? '' : `<label class="check"><input type="checkbox" id="rAct"${r.active ? ' checked' : ''}> Ativa</label>`}
    ${isNew ? '' : `<button class="linkbtn" style="color:var(--bad)" data-act="delRec">Eliminar</button>`}`);
  updateRecForm();
}
function updateRecForm(){

(() => {
  const sh = $('#sheet'), scrim = $('#scrim');
  let y0, x0, dy, mode, lastY, lastT, vel;
  sh.addEventListener('touchstart', ev => {
    if (!sh.classList.contains('open') || ev.touches.length !== 1) { mode = 'no'; return; }
    y0 = lastY = ev.touches[0].clientY; x0 = ev.touches[0].clientX; lastT = performance.now(); dy = 0; vel = 0; mode = null;
  }, { passive: true });
  sh.addEventListener('touchmove', ev => {
    if (mode === 'no') return;
    const t = ev.touches[0], my = t.clientY - y0, mx = t.clientX - x0;
    if (!mode){
      if (Math.abs(my) < 6 && Math.abs(mx) < 6) return;
      mode = my > 0 && Math.abs(my) > Math.abs(mx) && sh.scrollTop <= 0 ? 'drag' : 'no';
      if (mode !== 'drag') return;
      sh.style.transition = 'none'; scrim.style.transition = 'none';
      if (document.activeElement && document.activeElement.blur && sh.contains(document.activeElement)) document.activeElement.blur();
    }
    ev.preventDefault();
    const now = performance.now(); vel = (t.clientY - lastY) / Math.max(1, now - lastT); lastY = t.clientY; lastT = now;
    dy = Math.max(0, my);
    sh.style.transform = `translateY(${dy}px)`;
    scrim.style.opacity = String(Math.max(0, 1 - dy / (sh.offsetHeight || 400)));
  }, { passive: false });
  const end = () => {
    if (mode !== 'drag') { mode = null; return; }
    mode = null;
    sh.style.transition = ''; scrim.style.transition = '';
    const close = dy > Math.min(140, sh.offsetHeight * .3) || (vel > .5 && dy > 30);
    sh.style.transform = ''; scrim.style.opacity = '';
    if (close) closeSheet();
  };
  sh.addEventListener('touchend', end, { passive: true });
  sh.addEventListener('touchcancel', end, { passive: true });
})();

      case 'saveFund': { d.funds = d.funds || []; const f = { id:p.id || 'f' + (d.n++), name:p.name, color:p.color }; const i = d.funds.findIndex(x => x.id === f.id); if (i >= 0) d.funds[i] = f; else d.funds.push(f); r = { id:f.id }; break; }
      case 'deleteFund': d.funds = (d.funds || []).filter(f => f.id !== p.id); d.moves = (d.moves || []).filter(m => m.fund !== p.id); r = { id:p.id }; break;
      case 'saveMove': {
        d.moves = d.moves || [];
        const m = { id:p.id || 'v' + (d.n++), fund:p.fund, date:p.date || TODAY, desc:p.desc, cents:Math.abs(p.cents) * (p.type === 'in' ? 1 : -1), category:p.type === 'in' ? '' : p.category };
        const i = d.moves.findIndex(x => x.id === m.id); if (i >= 0) d.moves[i] = m; else d.moves.push(m); r = { id:m.id }; break;
      }
      case 'deleteMove': d.moves = (d.moves || []).filter(m => m.id !== p.id); r = { id:p.id }; break;
      case 'saveRecurring': {
        d.rec = d.rec || [];
        const rec = { id:p.id || 'r' + (d.n++), desc:p.desc, cents:p.cents, category:p.category, active:p.active !== false, last:TODAY_MONTH, freq:p.freq || 'mensal', day:p.day || '', fund:p.fund || '' };
        const i = d.rec.findIndex(x => x.id === rec.id); if (i >= 0) d.rec[i] = rec; else d.rec.push(rec);
        if (p.applyNow && !p.id) d.exp.push({ id:'n' + (d.n++), date:TODAY_MONTH + '-01', month:TODAY_MONTH, desc:p.desc, cents:p.cents, category:p.category });
        r = { id:rec.id }; break;
      }
      case 'setConfig': d.cfg = d.cfg || {}; d.cfg[p.key] = p.value; r = {}; break;
      case 'deleteRecurring': d.rec = (d.rec || []).filter(x => x.id !== p.id); r = { id:p.id }; break;
      case 'saveCategory': {
        d.cats = (d.cats || []).filter(c => c.name !== p.oldName);
        if (BUILTIN.concat(d.cats.map(c => c.name)).some(n => normTxt(n) === normTxt(p.name))) throw new Error('Já existe uma categoria com esse nome.');
        d.cats.push({ name:p.name, color:p.color, icon:p.icon, words:p.words });
        let moved = 0;
        d.exp.forEach(e => { if (p.oldName && e.category === p.oldName) e.category = p.name; else if (p.applyExisting && e.category !== p.name && matchesWords(e.desc, p.words)) { e.category = p.name; moved++; } });
        r = { name:p.name, moved }; break;
      }
      case 'deleteCategory': d.cats = (d.cats || []).filter(c => c.name !== p.name); d.exp.forEach(e => { if (e.category === p.name) e.category = 'Outros'; }); r = { name:p.name }; break;
      default: throw new Error('Ação desconhecida.');
    }
    save(d); return JSON.parse(JSON.stringify(r));
  };
})();

render();
if (DEMO) { ACCOUNT.email = 'pré-visualização'; regHello(); loadMonth(); }
else if (tokenValid() && ACCOUNT.email) { loadMonth(); regHello(); initAuth().catch(() => {}); }
else { showLogin(false); initAuth().catch(e => { $('#loginErr').textContent = e.message; $('#loginErr').hidden = false; }); }
// ao voltar à app depois de muito tempo, pede para continuar se a sessão expirou
document.addEventListener('visibilitychange', () => {
  if (DEMO || document.visibilityState !== 'visible' || !$('#login').hidden) return;
  if (!tokenValid()) return showLogin(true);
  // ao voltar à app (o iPhone mantém-na aberta em memória), lê de novo os valores do Google
  if (!F) { load(); refreshOthers(); }
});
// versão nova publicada → o service worker novo assume e a app recarrega sozinha (uma vez)
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadSW = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded && !F) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => {
    r.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => {}); });
  }).catch(() => {});
}
