<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orçamento</title>
<meta name="theme-color" content="#f1f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0f0e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Orçamento">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f1f3f0; --card:#ffffff; --ink:#141816; --muted:#6b726e; --line:#e8ebe7; --press:#eef1ed;
  --accent:#1d7553; --accent-ink:#ffffff; --soft:#e3f0e9;
  --bad:#d23c2e; --bad-soft:#fde8e5; --hyp:#6d4ee8; --hyp-soft:#eeeafd; --warn:#c27a00;
  --hero-a:#0d4f38; --hero-b:#1f8a62;
  --shadow:0 1px 2px rgba(16,24,20,.04),0 6px 20px rgba(16,24,20,.06);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d0f0e; --card:#181b19; --ink:#eef1ee; --muted:#959c97; --line:#262a27; --press:#212522;
    --accent:#3fb785; --accent-ink:#06150e; --soft:#17302a;
    --bad:#ff7a6a; --bad-soft:#3a1f1b; --hyp:#a28bff; --hyp-soft:#251f3d; --warn:#e3a33b;
    --hero-a:#0b3d2b; --hero-b:#17714f;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px)}
.top-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:calc(12px + env(safe-area-inset-top)) 16px 10px}
.top-in .period{justify-content:center}
.top-in > .round{justify-self:end}
.period{display:flex;align-items:center;gap:2px}
.period h1{font-size:20px;font-weight:800;letter-spacing:-.025em;margin:0 2px;min-width:0;white-space:nowrap;text-align:center}
.top-in{grid-template-columns:36px 1fr 36px !important}
.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.round:active{background:var(--press)}
.round svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.round.solid{background:var(--card);box-shadow:var(--shadow)}

main{max-width:520px;margin:0 auto;padding:4px 16px 0;display:flex;flex-direction:column;gap:18px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:20px 20px 18px;color:#fff;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));box-shadow:0 10px 30px -12px color-mix(in srgb,var(--hero-b) 70%,transparent)}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.16),transparent);pointer-events:none}
.hero.neg{--hero-a:#7a1d14;--hero-b:#c4402f}
.hero.sim{--hero-a:#3b2a8f;--hero-b:#7656ee}
.hero.funds{--hero-a:#1b2a5e;--hero-b:#3d5bd9;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
.hero.newfund{background:var(--card);color:var(--accent);box-shadow:none;border:2px dashed color-mix(in srgb,var(--accent) 45%,var(--line));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:150px;cursor:pointer}
.hero.newfund .plus{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent)}
.hero.newfund svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.hero.newfund b{font-size:16px}
.hero.newfund .hero-dots i{background:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--press);padding:4px;border-radius:14px}
.seg button{padding:10px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill.danger{color:var(--bad)}
.tx .pill{flex:none}
.months-pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months-pick .pill{padding:9px 0;text-align:center;font-size:13px}
.amt.in{color:var(--accent)}
.fund-dot{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block;margin-right:8px;vertical-align:1px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eyebrow{font-size:13px;font-weight:600;opacity:.85}
.chip-w{font-size:12px;font-weight:700;padding:6px 11px;border-radius:99px;background:rgba(255,255,255,.16);color:#fff;position:relative;z-index:1}
.chip-w.on{background:#fff;color:#3b2a8f}
.hero-main{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.big{font-size:44px;font-weight:800;letter-spacing:-.035em;line-height:1.05;white-space:nowrap}
.big .cents{font-size:26px;opacity:.85;letter-spacing:-.02em}
.hero-sub{font-size:13px;opacity:.8;margin-top:4px}
.hero{touch-action:pan-y}
.hero-dots{position:absolute;left:0;right:0;bottom:6px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.hero-dots i{width:5px;height:5px;border-radius:9px;background:#fff;opacity:.4;transition:width .2s,opacity .2s}
.hero-dots i.on{width:14px;opacity:.95}
.view-in-r > :not(.deck){animation:inR .45s cubic-bezier(.2,.9,.25,1) both}
.view-in-l > :not(.deck){animation:inL .45s cubic-bezier(.2,.9,.25,1) both}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
.deck{position:relative;overflow:hidden;margin:0 -16px -24px;padding:0 16px 24px;touch-action:pan-y;box-sizing:content-box}
.deck-track{display:flex;gap:16px;align-items:flex-start;transform:translateX(calc(-100% - 16px));will-change:transform}
.deck-slot{flex:0 0 100%;min-width:0}
.deck-slot .hero{transform-origin:center center;will-change:transform}
.deck-slot.side .hero{transform:scale(.94);opacity:.75}
@media (prefers-reduced-motion: reduce){.view-in-r,.view-in-l{animation:none}}
.ring{width:86px;height:86px;flex:none}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:rgba(255,255,255,.18)}
.ring .fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset .7s cubic-bezier(.2,.8,.2,1)}
.ring text{fill:#fff;text-anchor:middle;font-family:var(--font)}
.ring .t{font-size:15px;font-weight:800}
.ring .s{font-size:9px;opacity:.8;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:rgba(255,255,255,.12);border-radius:14px;padding:9px 9px;min-width:0}
.stat small{display:block;font-size:11px;opacity:.8;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{display:block;font-size:14px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.stat.tap{cursor:pointer}

/* section header */
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px -8px}
.sh h2{font-size:17px;font-weight:800;letter-spacing:-.015em;margin:0}
.sh span{font-size:13px;color:var(--muted);font-weight:600}

/* category rail */
.rail{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.cat-chip{flex:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;scroll-snap-align:start;background:var(--card);border-radius:18px;padding:12px;width:118px;text-align:left;box-shadow:var(--shadow);border:1.5px solid transparent;transition:transform .15s}
.cat-chip:active{transform:scale(.97)}
.cat-chip.on{border-color:var(--c)}
.cat-chip .ic{margin-bottom:10px}
.cat-chip small{display:block;color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-chip b{display:block;font-size:15px;font-weight:700;margin-top:1px}
.cat-chip .mini{height:4px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}
.cat-chip .mini i{display:block;height:100%;background:var(--c);border-radius:9px}
.cat-chip.add{width:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:transparent;box-shadow:none;border:1.5px dashed var(--line);color:var(--accent)}
.cat-chip.add svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.cat-chip.add small{color:var(--accent);white-space:normal;text-align:center;line-height:1.2}
.cat-pick.add{color:var(--accent)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:34px;height:34px;border-radius:50%;background:var(--c);border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatch.on{border-color:var(--card);box-shadow:0 0 0 2px var(--c)}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.icon-pick{aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:var(--press);border:1.5px solid transparent}
.icon-pick svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-pick.on{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent)}
.cat-prev{display:flex;align-items:center;gap:12px;margin:4px 4px 0;font-weight:700}

/* icons */
.ic{--c:#999;width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 15%,transparent)}
.ic svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:34px;height:34px;border-radius:11px}
.ic.sm svg{width:18px;height:18px}

/* transactions */
.day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:4px 6px 8px}
.group{display:flex;flex-direction:column}
.txs{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;position:relative;animation:in .35s ease both}
.tx + .tx::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--line)}
.tx:active{background:var(--press)}
.tx-main{flex:1;min-width:0}
.tx-main b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-main small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.amt{font-weight:700;font-size:15px;white-space:nowrap}
.tx.pending{opacity:.45}
.tx.off .tx-main b,.tx.off .amt{text-decoration:line-through;opacity:.4}
.tx.off .ic{filter:grayscale(1);opacity:.5}
.tx.hyp .amt,.tx.hyp .tx-main b{color:var(--hyp)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:6px;background:var(--hyp-soft);color:var(--hyp);margin-left:4px;vertical-align:1px}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.empty{background:var(--card);border-radius:22px;padding:32px 20px;text-align:center;box-shadow:var(--shadow)}
.empty .ic{margin:0 auto 12px;width:54px;height:54px;border-radius:18px}
.empty b{display:block;font-size:16px}
.empty p{color:var(--muted);margin:4px 0 16px;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:700;font-size:15px;background:var(--press);color:var(--ink);width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.hyp{background:var(--hyp);color:#fff}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.inline{width:auto}
.btn:disabled{opacity:.5}

.simbar{display:flex;align-items:center;gap:10px;background:var(--hyp-soft);color:var(--hyp);border-radius:16px;padding:10px 12px;font-size:13px;font-weight:600}
.simbar span{flex:1}
.simbar button{background:var(--hyp);color:#fff;border-radius:99px;padding:7px 13px;font-weight:700;font-size:13px}

/* cards (year) */
.card{background:var(--card);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.card h3{font-size:15px;font-weight:800;margin:0 0 12px;letter-spacing:-.01em}
.advice{display:flex;gap:12px;align-items:flex-start}
.advice p{margin:0;font-size:14px;color:var(--muted)}
.advice p b{color:var(--ink)}
.bars-wrap{position:relative;height:150px;display:flex;align-items:flex-end;gap:6px;padding-top:8px}
.bar-col{flex:1;height:100%;display:flex;align-items:flex-end;border-radius:8px;position:relative}
.bar-col i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--accent) 35%,var(--line));min-height:3px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.bar-col.cur i{background:var(--accent)}
.bar-col.over i{background:var(--bad)}
.bar-col.nodata i{background:var(--line)}
.budget-line{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.5;pointer-events:none}
.budget-line span{position:absolute;right:0;top:-18px;font-size:10.5px;font-weight:700;color:var(--muted)}
.bar-labels{display:flex;gap:6px;margin-top:6px}
.bar-labels span{flex:1;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.bar-labels span.cur{color:var(--accent);font-weight:800}
.crow{display:flex;align-items:center;gap:12px;padding:8px 0}
.crow-main{flex:1;min-width:0}
.crow-h{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.crow-h small{color:var(--muted);font-weight:500;margin-left:4px}
.track{height:6px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.track i{display:block;height:100%;border-radius:9px;background:var(--c,var(--accent))}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-top:1px solid var(--line);font-size:14px;width:100%;text-align:left}
.mrow:first-child{border-top:0}
.mrow b{font-weight:600}
.mrow .r{text-align:right}
.mrow .r small{display:block;font-size:12px;font-weight:600}
.pos{color:var(--accent)} .neg{color:var(--bad)}
.mrow small.s{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.mrow .r b{font-size:15px}
.mrow.cur > span:first-child > b::after{content:"em curso";margin-left:8px;font-size:11px;font-weight:700;color:var(--accent);background:var(--soft, rgba(29,117,83,.12));padding:2px 7px;border-radius:99px;vertical-align:1px}
.mrow.muted{opacity:.6}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.card-h button{color:var(--accent);font-weight:700;font-size:14px}
.brk{margin-top:6px}
.brk div{display:flex;justify-content:space-between;padding:10px 4px;border-top:1px solid var(--line);font-size:15px}
.brk div:first-child{border-top:0}
.brk span{color:var(--muted)}
.brk .tot{font-weight:700}
.brk .tot span{color:var(--ink)}

/* skeleton */
.sk{border-radius:22px;background:linear-gradient(90deg,var(--line) 25%,var(--press) 50%,var(--line) 75%);background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 84px 1fr;align-items:center;height:64px}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);padding:8px 0}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent)}
.fab{width:60px;height:60px;border-radius:22px;margin:-26px auto 0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 80%,transparent);transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}
body.sim .fab{background:var(--hyp);box-shadow:0 10px 24px -8px color-mix(in srgb,var(--hyp) 80%,transparent)}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,10,8,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:520px;background:var(--card);border-radius:28px 28px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.open{transform:none}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px;position:relative}
.grab::before{content:"";position:absolute;inset:-14px -60px}   /* zona de toque maior para arrastar */
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.sheet-h b{font-size:16px;font-weight:800}
.sheet-h button{font-weight:600;color:var(--muted);padding:6px 2px;min-width:64px;text-align:left}
.sheet-h button:last-child{text-align:right}
.amount{text-align:center;font-size:48px;font-weight:800;letter-spacing:-.035em;padding:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.amount.zero{color:var(--muted);opacity:.5}
.amount-cap{text-align:center;color:var(--muted);font-size:12.5px;font-weight:600;margin-bottom:12px}
.field{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:16px;border:1.5px solid transparent;background:var(--press);color:var(--ink);outline:none}
.field:focus{border-color:var(--accent)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:16px 4px 8px;display:block}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 2px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat-pick{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;padding:8px 4px;border-radius:16px;border:1.5px solid transparent;font-size:11.5px;font-weight:600;color:var(--muted)}
.cat-pick.on{border-color:var(--c);color:var(--ink);background:color-mix(in srgb,var(--c) 8%,transparent)}
.dates{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:9px 14px;border-radius:99px;background:var(--press);font-weight:600;font-size:14px}
.pill.on{background:var(--ink);color:var(--card)}
.date-in{font:inherit;font-size:14px;font-weight:600;padding:8px 12px;border-radius:99px;border:0;background:var(--press);color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0 12px}
.key{height:52px;border-radius:16px;background:var(--press);font-size:22px;font-weight:600;display:grid;place-items:center;transition:transform .08s}
.key:active{transform:scale(.95);background:var(--line)}
.key svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* teclado numérico da app em todos os campos de valores (fica fixo no fundo da janela) */
.kp-pad{position:sticky;bottom:0;z-index:2;background:var(--card);margin:14px -2px 0;padding:10px 2px 4px;gap:7px}
.kp-pad .key{height:48px}
[data-kpf]{cursor:pointer;caret-color:transparent;font-size:18px;font-weight:700}
[data-kpf].kp-on{border-color:var(--accent)}
[data-kpf].kp-on.fresh{color:var(--accent)}
.linkbtn{display:block;width:100%;text-align:center;color:var(--accent);font-weight:700;font-size:14px;padding:14px 0 2px}
textarea.field{resize:vertical;min-height:180px;line-height:1.5}
.hint{font-size:13px;color:var(--muted);margin:8px 4px 0}
.check{display:flex;align-items:center;gap:10px;font-size:14px;margin:12px 4px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px 4px;border-top:1px solid var(--line);font-weight:600;text-decoration:none;color:var(--ink)}
.set-row span{color:var(--muted);font-weight:500;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;margin-left:12px}
.set-row.logout{color:var(--bad)}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--card);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
/* login */
.login{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + env(safe-area-inset-bottom));text-align:center}
.login[hidden]{display:none}
.login .logo{width:96px;height:96px;border-radius:26px;box-shadow:0 14px 34px -14px rgba(13,79,56,.7);margin-bottom:22px}
.login h2{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:0}
.login p{color:var(--muted);margin:8px 0 32px;max-width:300px;font-size:15px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;max-width:320px;height:54px;border-radius:16px;background:var(--card);color:var(--ink);font-weight:700;font-size:16px;border:1px solid var(--line);box-shadow:var(--shadow)}
.gbtn:active{transform:scale(.98)}
.gbtn svg{width:22px;height:22px}
.login .other{margin-top:16px;color:var(--muted);font-weight:600;font-size:14px}
.login .err{color:var(--bad);font-size:14px;margin-top:16px;max-width:320px}
body.locked{overflow:hidden}
/* com uma janela aberta, o ecrã de trás fica parado (no iPhone só "position:fixed" impede o scroll) */
body.sheet-lock{position:fixed;left:0;right:0;overflow:hidden}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.scrim{touch-action:none}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>

<script>

/* ---------- categorias criadas pelo utilizador (folha "Categorias") ---------- */
const BUILTIN = Object.keys(CAT);

  fork: '<path d="M7 3v8a2 2 0 0 0 2 2v8M5 3v5a2 2 0 0 0 2 2M11 3v5a2 2 0 0 1-2 2M17 21V3c-2 1-3 4-3 8h3"/>',
  cup: '<path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17M8 3v2M12 3v2"/>',

  scissors: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5L20 19M8.5 16.5L20 5"/>',
  dumbbell: '<path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/>',
  paw: '<circle cx="5" cy="10" r="2"/><circle cx="9" cy="5" r="2"/><circle cx="15" cy="5" r="2"/><circle cx="19" cy="10" r="2"/><path d="M12 11c-3 0-6 4-6 7a2 2 0 0 0 2 2c1.5 0 2.5-1 4-1s2.5 1 4 1a2 2 0 0 0 2-2c0-3-3-7-6-7z"/>',
  plane: '<path d="M2 12l20-8-6 17-4-7z"/><path d="M12 14l4-4"/>',
  book: '<path d="M4 4h6a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a3 3 0 0 0-3 3M20 4v14h-7"/>',

};
const CAT_COLORS = ['#ef6c57', '#f59e0b', '#84cc16', '#14b8a6', '#06b6d4', '#3b82f6', '#6366f1', '#a855f7', '#ec4899', '#78716c'];
const normTxt = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
let CUSTOM = [];   // [{ name, color, icon, words: [] }]

  CUSTOM.forEach(c => { CAT[c.name] = { c: CAT_COLORS.includes(c.color) || /^#[0-9a-f]{6}$/i.test(c.color) ? c.color : CAT_COLORS[0], i: CAT_ICONS[c.icon] || CAT_ICONS.tag, custom: true }; });
  CATS.splice(0, CATS.length, ...BUILTIN.filter(k => k !== 'Outros'), ...CUSTOM.map(c => c.name), 'Outros');
}
/* ---------- cor da app (cartões do Mês e do Ano) ---------- */
const APP_COLORS = ['#1f8a62', '#ef6c57', '#f59e0b', '#14b8a6', '#06b6d4', '#3b82f6', '#6366f1', '#a855f7', '#ec4899', '#78716c'];
let APP_COLOR = (() => { try { const c = localStorage.getItem('orc.color'); return APP_COLORS.includes(c) ? c : APP_COLORS[0]; } catch (e) { return APP_COLORS[0]; } })();
function applyAppColor(c, persist){
  if (!APP_COLORS.includes(c)) c = APP_COLORS[0];
  const r = document.documentElement.style;
  if (c === APP_COLORS[0]) { r.removeProperty('--hero-a'); r.removeProperty('--hero-b'); }   // verde original
  else { r.setProperty('--hero-a', `color-mix(in srgb, ${c} 55%, #0b1020)`); r.setProperty('--hero-b', c); }
  if (persist) { APP_COLOR = c; try { localStorage.setItem('orc.color', c); } catch (e) {} }
}
applyAppColor(APP_COLOR);
const REG = { admin: false, blocked: false };   // estado devolvido pelo registo de utilizadores
const addCatBtn =`<button class="cat-pick add" data-act="newCat" style="--c:var(--accent)"><i class="ic sm"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>Nova</button>`;
const matchesWords =(desc, words) => { const d = normTxt(desc); return (words || []).some(w => { w = normTxt(w); return w && d.includes(w); }); };
const guessCat = d => { const c = CUSTOM.find(x => matchesWords(d, x.words)); return c ? c.name : (KW.find(k => k[0].test(d)) || [0, 'Outros'])[1]; };

/* ============================== util ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const icon = (cat, cls) => { const k = CAT[cat] ? cat : 'Outros'; return `<i class="ic ${cls || ''}" style="--c:${CAT[k].c}"><svg viewBox="0 0 24 24">${CAT[k].i}</svg></i>`; };
const buzz = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

/** Formato monetário português: 1.234,56 € — cálculos sempre em cêntimos inteiros. */
function eur(c){
  const neg = c < 0; c = Math.abs(Math.round(c));
  const i = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return (neg ? '−' : '') + i + ',' + pad(c % 100) + ' €';
}
function eurBig(c){
  const neg = c < 0; c = Math.abs(Math.round(c));
  const i = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return `${neg ? '−' : ''}${i}<span class="cents">,${pad(c % 100)} €</span>`;
}
const num = c => eur(c).replace(' €', '').replace('−', '-');
const pct = bp => (bp / 100).toFixed(2).replace('.', ',') + '%';
const monthLabel = m => MESES[+m.slice(5) - 1] + ' ' + m.slice(0, 4);
const fmtDate = d => +d.slice(8, 10) + ' ' + MES_C[+d.slice(5, 7) - 1] + ' ' + d.slice(0, 4);
const amountOrZero = s => { s = String(s).trim(); return s === '' || /^0+([.,]0*)?\s*€?$/.test(s) ? 0 : parseAmount(s); };

function parseAmount(s){
  s = String(s).replace(/€/g, '').replace(/\s/g, '').replace(/[,.]$/, '');
  if (!/^-?\d+([.,]\d+)*$/.test(s)) return null;
  let t;
  if (s.includes(',')) t = s.replace(/\./g, '').replace(',', '.');
  else { const p = s.split('.'); t = (p.length > 2 || (p.length === 2 && p[1].length === 3)) ? s.replace(/\./g, '') : s; }
  if (!/^-?\d+(\.\d{1,2})?$/.test(t)) return null;
  const c = Math.round(parseFloat(t) * 100);
  return c === 0 || Math.abs(c) > 1e8 ? null : c;
}
function dayLabel(d){
  const t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  if (d === ymd(t)) return 'Hoje';
  if (d === ymd(y)) return 'Ontem';
  const [Y, M, D] = d.split('-').map(Number);
  return DIAS[new Date(Y, M - 1, D).getDay()] + ', ' + D + ' ' + MES_C[M - 1];
}
function ring(frac, t, s){
  const r = 35, C = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg class="ring" viewBox="0 0 86 86" aria-hidden="true"><circle class="bg" cx="43" cy="43" r="${r}"/>
    <circle class="fg" cx="43" cy="43" r="${r}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - f)).toFixed(2)}" transform="rotate(-90 43 43)"/>

}

/* ============================== Google: login ============================== */
const CLIENT_ID = '1003246535335-i5duipob43pmjfgj52oon00fa71sq56p.apps.googleusercontent.com';
const DEMO = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]real\b/.test(location.search);   // no PC: pré-visualização com dados de exemplo

const LS = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },

const ACCOUNT = { email: LS.get('orc.email') || '', name: LS.get('orc.name') || '' };
let TOKEN = LS.get('orc.token');                     // { t, exp }
let tokenClient = null, pendingAuth = null;
const tokenValid = () => TOKEN && TOKEN.exp > Date.now() + 30000;

class AuthError extends Error {}

function gisReady(){
  return new Promise((res, rej) => {
    let n = 0;
    (function wait(){
      if (window.google && google.accounts && google.accounts.oauth2) return res();
      if (++n > 100) return rej(new Error('Não foi possível carregar o login Google. Verifica a ligação à internet.'));
      setTimeout(wait, 100);
    })();
  });
}
async function initAuth(){
  await gisReady();
  if (tokenClient) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPES,
    callback: r => {
      const p = pendingAuth; pendingAuth = null; if (!p) return;
      if (r.error) return p.rej(new Error(r.error_description || r.error));
      if (!google.accounts.oauth2.hasGrantedAllScopes(r, SCOPE_FILE)) return p.rej(new Error('É preciso autorizar o acesso aos ficheiros da app no Google Drive para guardar as tuas despesas.'));
      TOKEN = { t: r.access_token, exp: Date.now() + (Number(r.expires_in) || 3600) * 1000 };
      LS.set('orc.token', TOKEN);
      p.res();
    },
    error_callback: e => { const p = pendingAuth; pendingAuth = null; if (p) p.rej(new Error(e && e.type === 'popup_closed' ? 'Login cancelado.' : 'O login não abriu. Permite janelas pop-up para este site e tenta de novo.')); }
  });
}
async function signIn(chooseAccount){
  await initAuth();
  await new Promise((res, rej) => {
    pendingAuth = { res, rej };
    const opts = { prompt: chooseAccount ? 'select_account' : '' };
    if (!chooseAccount && ACCOUNT.email) opts.hint = ACCOUNT.email;
    tokenClient.requestAccessToken(opts);
  });
  const me = await gfetch('https://openidconnect.googleapis.com/v1/userinfo');
  if (ACCOUNT.email && me.email !== ACCOUNT.email) { SS = null; }
  ACCOUNT.email = me.email || ''; ACCOUNT.name = me.name || '';
  LS.set('orc.email', ACCOUNT.email); LS.set('orc.name', ACCOUNT.name);
}

async function regCall(action, extra){

async function gfetch(url, opts){
  if (!tokenValid()) throw new AuthError('Sessão expirada');
  opts = opts || {};
  const headers = Object.assign({ Authorization: 'Bearer ' + TOKEN.t }, opts.body ? { 'Content-Type': 'application/json' } : {});
  let r;
  try { r = await fetch(url, Object.assign({}, opts, { headers })); }
  catch (e) { throw new Error('Sem ligação à internet.'); }
  if (r.status === 401) { TOKEN = null; LS.del('orc.token'); throw new AuthError('Sessão expirada'); }
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : {};
  if (!r.ok) { const err = new Error((data.error && data.error.message) || ('Erro ' + r.status)); err.status = r.status; throw err; }
  return data;
}

const SHEETS_API = 'https://sheets.googleapis.com/v4/spreadsheets';
const DRIVE_API = 'https://www.googleapis.com/drive/v3/files';
let SS = null;    // { id, sheetIds: { Despesas: n, ... } }

async function getSS(){
  if (SS) return SS;
  const key = 'orc.ss.' + ACCOUNT.email;
  let id = LS.get(key);
  if (!id) {
    const q = encodeURIComponent("appProperties has { key='orcamentoApp' and value='1' } and trashed=false");
    const r = await gfetch(`${DRIVE_API}?q=${q}&fields=files(id)&spaces=drive&pageSize=1`);
    id = r.files && r.files[0] ? r.files[0].id : null;
  }
  if (id) {
    try { SS = await loadMeta(id); }
    catch (e) { if (e.status === 404 || e.status === 403) { id = null; LS.del(key); } else throw e; }
  }
  if (!SS) SS = await createSS();
  LS.set(key, SS.id);
  return SS;
}
async function loadMeta(id){
  const m = await gfetch(`${SHEETS_API}/${id}?fields=sheets.properties(sheetId,title)`);
  const sheetIds = {}; m.sheets.forEach(s => { sheetIds[s.properties.title] = s.properties.sheetId; });
  if (sheetIds.Despesas == null) { const e = new Error('Folha inválida'); e.status = 404; throw e; }
  if (['Extras', 'Recorrentes', 'Categorias', 'Fundos', 'Movimentos'].some(k => sheetIds[k] == null)) await addMissingSheets(id, sheetIds);
  return { id, sheetIds };
}
// folhas antigas: acrescenta as folhas novas ("Extras", "Recorrentes") e a coluna do salário em "Meses"
async function addMissingSheets(id, sheetIds){
  const want = [['Extras', EXTRAS_HEAD, 'F'], ['Recorrentes', REC_HEAD, 'J'], ['Categorias', CATS_HEAD, 'D'], ['Fundos', FUNDS_HEAD, 'C'], ['Movimentos', MOVES_HEAD, 'F']].filter(w => sheetIds[w[0]] == null);
  const r = await gfetch(`${SHEETS_API}/${id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests:
    want.map(w => ({ addSheet: { properties: { title: w[0], gridProperties: { frozenRowCount: 1 } } } })) }) });
  want.forEach((w, i) => { sheetIds[w[0]] = r.replies[i].addSheet.properties.sheetId; });
  const data = want.map(w => ({ range: `${w[0]}!A1:${w[2]}1`, values: [w[1]] }));
  if (want.some(w => w[0] === 'Extras')) data.push({ range: 'Meses!C1', values: [['Salário (€)']] });
  await gfetch(`${SHEETS_API}/${id}/values:batchUpdate`, { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data }) });
}
const EXTRAS_HEAD = ['ID', 'Ano', 'Data', 'Descrição', 'Valor (€)', 'Gasto (€)'];
const REC_HEAD = ['ID', 'Descrição', 'Valor (€)', 'Categoria', 'Ativa', 'Último lançamento', 'Criado em', 'Frequência', 'Data (MM-DD)', 'Fundo'];
const CATS_HEAD = ['Nome', 'Cor', 'Ícone', 'Palavras-chave'];
const FUNDS_HEAD = ['ID', 'Nome', 'Cor'];
const MOVES_HEAD = ['ID', 'Fundo', 'Data', 'Descrição', 'Valor (€)', 'Categoria'];
async function createSS(){
  const head = cols => ({ values: cols.map(c => ({ userEnteredValue: { stringValue: c }, userEnteredFormat: { textFormat: { bold: true }, backgroundColor: { red: .886, green: .941, blue: .91 } } })) });
  const sheet = (title, id, cols, extra) => ({ properties: { title, sheetId: id, gridProperties: { frozenRowCount: 1 } }, data: [{ rowData: [head(cols)].concat(extra || []) }] });
  const ss = await gfetch(SHEETS_API, { method: 'POST', body: JSON.stringify({
    properties: { title: SS_TITLE, locale: 'pt_PT', timeZone: 'Europe/Lisbon' },
    sheets: [
      sheet('Despesas', 0, ['ID', 'Data', 'Mês', 'Descrição', 'Valor (€)', 'Categoria', 'Criado em']),
      sheet('Meses', 1, ['Mês', 'Orçamento (€)', 'Salário (€)']),
      sheet('Extras', 4, EXTRAS_HEAD),
      sheet('Recorrentes', 5, REC_HEAD),
      sheet('Categorias', 6, CATS_HEAD),
      sheet('Fundos', 7, FUNDS_HEAD),
      sheet('Movimentos', 8, MOVES_HEAD),
      sheet('Objetivos', 2, ['Ano', 'Meta de poupança (€)']),
      sheet('Config', 3, ['Chave', 'Valor'], [{ values: [{ userEnteredValue: { stringValue: 'orcamentoPadrao' } }, { userEnteredValue: { numberValue: 400 } }] }])
    ]
  }) });
  const money = (sheetId, c) => ({ repeatCell: { range: { sheetId, startRowIndex: 1, startColumnIndex: c, endColumnIndex: c + 1 }, cell: { userEnteredFormat: { numberFormat: { type: 'CURRENCY', pattern: '#,##0.00 "€"' } } }, fields: 'userEnteredFormat.numberFormat' } });
  await gfetch(`${SHEETS_API}/${ss.spreadsheetId}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: [
    money(0, 4), money(1, 1), money(1, 2), money(2, 1), money(4, 4), money(4, 5), money(5, 2), money(8, 4),
    { updateDimensionProperties: { range: { sheetId: 0, dimension: 'COLUMNS', startIndex: 0, endIndex: 1 }, properties: { hiddenByUser: true }, fields: 'hiddenByUser' } },
    { updateDimensionProperties: { range: { sheetId: 0, dimension: 'COLUMNS', startIndex: 3, endIndex: 4 }, properties: { pixelSize: 220 }, fields: 'pixelSize' } }
  ] }) });
  await gfetch(`${DRIVE_API}/${ss.spreadsheetId}`, { method: 'PATCH', body: JSON.stringify({ appProperties: { orcamentoApp: '1' } }) });
  return { id: ss.spreadsheetId, sheetIds: { Despesas: 0, Meses: 1, Objetivos: 2, Config: 3, Extras: 4, Recorrentes: 5, Categorias: 6, Fundos: 7, Movimentos: 8 } };
}

const toStr = v => v == null ? '' : String(v);
async function readAll(){
  const ss = await getSS();
  const ranges = ['Despesas!A2:F', 'Meses!A2:C', 'Objetivos!A2:B', 'Config!A2:B', 'Extras!A2:F', 'Recorrentes!A2:J', 'Categorias!A2:D', 'Fundos!A2:C', 'Movimentos!A2:F'].map(r => 'ranges=' + encodeURIComponent(r)).join('&');
  const r = await gfetch(`${SHEETS_API}/${ss.id}/values:batchGet?${ranges}&valueRenderOption=UNFORMATTED_VALUE`);
  const v = i => (r.valueRanges[i] && r.valueRanges[i].values) || [];
  const cats = v(6).map((x, i) => ({ row: i + 2, name: cleanDesc(x[0]).slice(0, 30), color: toStr(x[1]), icon: toStr(x[2]), words: toStr(x[3]).split(',').map(w => w.trim()).filter(Boolean) })).filter(c => c.name);
  applyCustomCats(cats);
  const exp = v(0).map((x, i) => ({ row: i + 2, id: toStr(x[0]), date: toStr(x[1]), month: toStr(x[2]), desc: toStr(x[3]), cents: Math.round(Number(x[4]) * 100), category: CAT[x[5]] ? x[5] : 'Outros' }))
    .filter(e => e.id && /^\d{4}-\d{2}$/.test(e.month) && isFinite(e.cents));
  const cents = x => x === '' || x == null || !isFinite(Number(x)) ? null : Math.round(Number(x) * 100);
  const months = {}; v(1).forEach((x, i) => { if (x[0] !== '' && x[0] != null) months[toStr(x[0])] = { row: i + 2, budget: Math.round(Number(x[1]) * 100), salary: cents(x[2]) }; });
  const extras = v(4).map((x, i) => ({ row: i + 2, id: toStr(x[0]), year: toStr(x[1]), date: toStr(x[2]), desc: toStr(x[3]), cents: cents(x[4]) || 0, spent: cents(x[5]) || 0 })).filter(e => e.id);
  const goals = {}; v(2).forEach((x, i) => { if (x[0] !== '' && x[0] != null) goals[toStr(x[0])] = { row: i + 2, goal: Math.round(Number(x[1]) * 100) }; });
  const cfg = {}; v(3).forEach((x, i) => { cfg[toStr(x[0])] = { row: i + 2, value: x[1] }; });
  const dv = cfg.orcamentoPadrao ? Number(cfg.orcamentoPadrao.value) : 400;
  // próxima linha livre de cada folha (escrevemos sempre em posições exatas; o "append" do Google pode desalinhar colunas)
  const rec = v(5).map((x, i) => ({ row: i + 2, id: toStr(x[0]), desc: toStr(x[1]), cents: cents(x[2]) || 0, category: CAT[x[3]] ? x[3] : 'Outros',
    active: !(x[4] === false || /^(false|não|nao|0)$/i.test(toStr(x[4]))), last: toStr(x[5]),
    freq: toStr(x[7]) === 'anual' ? 'anual' : 'mensal', day: /^\d{2}-\d{2}$/.test(toStr(x[8])) ? toStr(x[8]) : '01-01', fund: toStr(x[9]) })).filter(r => r.id);
  const funds = v(7).map((x, i) => ({ row: i + 2, id: toStr(x[0]), name: toStr(x[1]), color: toStr(x[2]) || '#6366f1' })).filter(f => f.id);
  const moves = v(8).map((x, i) => ({ row: i + 2, id: toStr(x[0]), fund: toStr(x[1]), date: toStr(x[2]), desc: toStr(x[3]), cents: cents(x[4]) || 0, category: toStr(x[5]) })).filter(m => m.id && m.cents);
  const next = { Despesas: v(0).length + 2, Meses: v(1).length + 2, Objetivos: v(2).length + 2, Config: v(3).length + 2, Extras: v(4).length + 2, Recorrentes: v(5).length + 2, Categorias: v(6).length + 2, Fundos: v(7).length + 2, Movimentos: v(8).length + 2 };
  return { ss, exp, months, goals, cfg, extras, rec, cats, funds, moves, next, def: Math.round((isFinite(dv) && dv >= 0 ? dv : 400) * 100) };
}
const putValues = (ss, range, values) => gfetch(`${SHEETS_API}/${ss.id}/values/${encodeURIComponent(range)}?valueInputOption=RAW`, { method: 'PUT', body: JSON.stringify({ values }) });
// escreve linhas novas a partir da próxima linha livre, nas colunas exatas (A…)
function appendRows(D, sheet, values){
  const start = D.next[sheet], end = start + values.length - 1;
  const lastCol = String.fromCharCode(64 + values[0].length);
  D.next[sheet] = end + 1;
  return putValues(D.ss, `${sheet}!A${start}:${lastCol}${end}`, values);
}
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const nowStamp = () => { const d = new Date(); return ymd(d) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
const cleanDesc = d => String(d == null ? '' : d).replace(/^[=+@\s]+/, '').trim().slice(0, 100);
function checkCents(c){ c = Number(c); if (!Number.isInteger(c) || c === 0 || Math.abs(c) > 1e8) throw new Error('Valor inválido.'); return c; }

const nextMonth = m => { const [a, b] = m.split('-').map(Number); const d = new Date(a, b, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
// Despesas recorrentes: no dia 1 de cada mês (na primeira vez que a app abre) são lançadas no mês.
// Se a app não abrir durante algum tempo, recupera os meses em falta (até 12).
// Anuais: lançadas no dia marcado (ex.: 19 de abril), no orçamento do mês ou num fundo.
async function applyRecurring(D){
  const rows = [], moves = [], marks = [], newMonths = new Set(), stamp = nowStamp(), Y = +TODAY.slice(0, 4);
  const addExpense = (r, date) => { const m = date.slice(0, 7); rows.push([uuid(), date, m, r.desc, r.cents / 100, r.category, stamp]); if (!D.months[m]) newMonths.add(m); };
  D.rec.filter(r => r.active && r.cents && r.freq === 'mensal' && /^\d{4}-\d{2}$/.test(r.last) && r.last < TODAY_MONTH).forEach(r => {
    let m = r.last, n = 0;
    while (m < TODAY_MONTH && n < 12){ m = nextMonth(m); n++; addExpense(r, m + '-01'); }
    marks.push({ range: `Recorrentes!F${r.row}`, values: [[TODAY_MONTH]] });
  });
  D.rec.filter(r => r.active && r.cents && r.freq === 'anual' && /^\d{4}$/.test(r.last) && +r.last < Y).forEach(r => {
    let y = +r.last + 1, last = +r.last;
    while (y <= Y && y - r.last <= 3){
      const date = y + '-' + r.day; if (date > TODAY) break;
      if (r.fund && D.funds.some(f => f.id === r.fund)) moves.push([uuid(), r.fund, date, r.desc, -r.cents / 100, r.category]);
      else addExpense(r, date);
      last = y; y++;
    }
    if (last !== +r.last) marks.push({ range: `Recorrentes!F${r.row}`, values: [[String(last)]] });
  });
  if (!rows.length && !moves.length) return 0;
  // marca primeiro como lançadas (evita duplicar se a app abrir em dois sítios ao mesmo tempo)
  await gfetch(`${SHEETS_API}/${D.ss.id}/values:batchUpdate`, { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data: marks }) });
  if (rows.length) await appendRows(D, 'Despesas', rows);
  if (moves.length) await appendRows(D, 'Movimentos', moves);
  if (newMonths.size) await appendRows(D, 'Meses', [...newMonths].sort().map(m => [m, D.def / 100]));
  return rows.length + moves.length;
}
// último ano já lançado de uma anual: se a data deste ano já passou, conta como feita (não lança para trás)
const annualLast = day => String(+TODAY.slice(0, 4) - (TODAY.slice(0, 4) + '-' + day <= TODAY ? 0 : 1));

async function api(action, p){
  let D = await readAll(), auto = 0;
  if (action === 'getMonth' || action === 'getYear' || action === 'getRecurring' || action === 'getFunds'){
    auto = await applyRecurring(D);
    if (auto) D = await readAll();
  }
  const ss = D.ss;
  switch (action){
    case 'getRecurring': return { items: D.rec.map(({ row, ...r }) => r), funds: D.funds.map(f => ({ id: f.id, name: f.name, color: f.color })), auto };
    case 'getFunds': {
      const yr = String(p.year);
      const funds = D.funds.map(f => {
        const mv = D.moves.filter(m => m.fund === f.id), y = mv.filter(m => m.date.slice(0, 4) === yr);
        return { id: f.id, name: f.name, color: f.color, balance: mv.reduce((s, m) => s + m.cents, 0),
          in: y.filter(m => m.cents > 0).reduce((s, m) => s + m.cents, 0), out: -y.filter(m => m.cents < 0).reduce((s, m) => s + m.cents, 0) };
      });
      const ids = new Set(D.funds.map(f => f.id));
      const moves = D.moves.filter(m => ids.has(m.fund)).map(({ row, ...m }) => m).sort((a, b) => b.date.localeCompare(a.date));
      return { year: p.year, funds, moves, auto };
    }
    case 'saveFund': {
      const name = cleanDesc(p.name).slice(0, 30); if (!name) throw new Error('Nome em falta.');
      if (D.funds.some(f => f.id !== p.id && normTxt(f.name) === normTxt(name))) throw new Error('Já existe um fundo com esse nome.');
      const color = CAT_COLORS.includes(p.color) ? p.color : CAT_COLORS[6];
      if (p.id){
        const f = D.funds.find(x => x.id === p.id); if (!f) throw new Error('Fundo não encontrado — atualiza a app.');
        await putValues(ss, `Fundos!B${f.row}:C${f.row}`, [[name, color]]);
        return { id: p.id };
      }
      const id = uuid(); await appendRows(D, 'Fundos', [[id, name, color]]); return { id };
    }
    case 'deleteFund': {
      const f = D.funds.find(x => x.id === p.id); if (!f) throw new Error('Fundo não encontrado — atualiza a app.');
      const del = (sheetId, rows) => rows.sort((a, b) => b - a).map(r => ({ deleteDimension: { range: { sheetId, dimension: 'ROWS', startIndex: r - 1, endIndex: r } } }));
      const requests = del(ss.sheetIds.Movimentos, D.moves.filter(m => m.fund === f.id).map(m => m.row)).concat(del(ss.sheetIds.Fundos, [f.row]));
      await gfetch(`${SHEETS_API}/${ss.id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests }) });
      // anuais que eram pagas por este fundo passam para o orçamento do mês
      const data = D.rec.filter(r => r.fund === f.id).map(r => ({ range: `Recorrentes!J${r.row}`, values: [['']] }));
      if (data.length) await gfetch(`${SHEETS_API}/${ss.id}/values:batchUpdate`, { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data }) });
      return { id: f.id };
    }
    case 'saveMove': {
      if (!D.funds.some(f => f.id === p.fund)) throw new Error('Escolhe um fundo.');
      const desc = cleanDesc(p.desc); if (!desc) throw new Error('Descrição em falta.');
      const cents = Math.abs(checkCents(p.cents)) * (p.type === 'in' ? 1 : -1);
      const date = /^\d{4}-\d{2}-\d{2}$/.test(p.date) ? p.date : TODAY;
      const category = p.type === 'in' ? '' : (CAT[p.category] ? p.category : 'Outros');
      const row = [p.fund, date, desc, cents / 100, category];
      if (p.id){
        const m = D.moves.find(x => x.id === p.id); if (!m) throw new Error('Movimento não encontrado — atualiza a app.');
        await putValues(ss, `Movimentos!B${m.row}:F${m.row}`, [row]); return { id: p.id };
      }
      const id = uuid(); await appendRows(D, 'Movimentos', [[id, ...row]]); return { id };
    }
    case 'deleteMove': {
      const m = D.moves.find(x => x.id === p.id); if (!m) throw new Error('Movimento não encontrado — atualiza a app.');
      await gfetch(`${SHEETS_API}/${ss.id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: ss.sheetIds.Movimentos, dimension: 'ROWS', startIndex: m.row - 1, endIndex: m.row } } }] }) });
      return { id: m.id };
    }
    case 'saveCategory': {
      const name = cleanDesc(p.name).slice(0, 30); if (!name) throw new Error('Nome em falta.');
      const old = p.oldName ? D.cats.find(c => c.name === p.oldName) : null;
      if (p.oldName && !old) throw new Error('Categoria não encontrada — atualiza a app.');
      if (BUILTIN.some(b => normTxt(b) === normTxt(name)) || D.cats.some(c => c !== old && normTxt(c.name) === normTxt(name))) throw new Error('Já existe uma categoria com esse nome.');
      const words = (p.words || []).map(w => cleanDesc(w).replace(/,/g, '')).filter(Boolean).slice(0, 30);
      const row = [name, CAT_COLORS.includes(p.color) ? p.color : CAT_COLORS[0], CAT_ICONS[p.icon] ? p.icon : 'tag', words.join(', ')];
      const data = [];
      if (old){
        data.push({ range: `Categorias!A${old.row}:D${old.row}`, values: [row] });
        if (old.name !== name){   // mudar o nome também nas despesas e recorrentes
          D.exp.filter(e => e.category === old.name).forEach(e => data.push({ range: `Despesas!F${e.row}`, values: [[name]] }));
          D.rec.filter(r => r.category === old.name).forEach(r => data.push({ range: `Recorrentes!D${r.row}`, values: [[name]] }));
        }
      } else data.push({ range: `Categorias!A${D.next.Categorias}:D${D.next.Categorias}`, values: [row] });
      let moved = 0;
      if (p.applyExisting && words.length){
        D.exp.filter(e => e.category !== name && (!old || e.category !== old.name) && matchesWords(e.desc, words)).forEach(e => { moved++; data.push({ range: `Despesas!F${e.row}`, values: [[name]] }); });
      }
      for (let i = 0; i < data.length; i += 400)
        await gfetch(`${SHEETS_API}/${ss.id}/values:batchUpdate`, { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data: data.slice(i, i + 400) }) });
      return { name, moved };
    }
    case 'deleteCategory': {
      const c = D.cats.find(x => x.name === p.name); if (!c) throw new Error('Categoria não encontrada — atualiza a app.');
      const data = D.exp.filter(e => e.category === c.name).map(e => ({ range: `Despesas!F${e.row}`, values: [['Outros']] }))
        .concat(D.rec.filter(r => r.category === c.name).map(r => ({ range: `Recorrentes!D${r.row}`, values: [['Outros']] })));
      for (let i = 0; i < data.length; i += 400)
        await gfetch(`${SHEETS_API}/${ss.id}/values:batchUpdate`, { method: 'POST', body: JSON.stringify({ valueInputOption: 'RAW', data: data.slice(i, i + 400) }) });
      await gfetch(`${SHEETS_API}/${ss.id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: ss.sheetIds.Categorias, dimension: 'ROWS', startIndex: c.row - 1, endIndex: c.row } } }] }) });
      return { name: c.name };
    }
    case 'saveRecurring': {
      const desc = cleanDesc(p.desc); if (!desc) throw new Error('Descrição em falta.');
      const cents = checkCents(p.cents), category = CAT[p.category] ? p.category : 'Outros', active = p.active !== false;
      const freq = p.freq === 'anual' ? 'anual' : 'mensal';
      const day = freq === 'anual' && /^\d{2}-\d{2}$/.test(p.day) ? p.day : '';
      if (freq === 'anual' && !day) throw new Error('Escolhe a data.');
      const fund = freq === 'anual' && D.funds.some(f => f.id === p.fund) ? p.fund : '';
      await putValues(ss, 'Recorrentes!F1:J1', [REC_HEAD.slice(5)]);   // cabeçalhos novos em folhas antigas
      if (p.id){
        const r = D.rec.find(x => x.id === p.id); if (!r) throw new Error('Despesa recorrente não encontrada — atualiza a app.');
        // ao reativar (ou mudar a data de uma anual), só volta a lançar a partir da próxima ocorrência
        let last = r.last;
        if (freq === 'mensal' && (r.freq !== 'mensal' || (active && !r.active))) last = TODAY_MONTH;
        if (freq === 'anual' && (r.freq !== 'anual' || r.day !== day || (active && !r.active))) last = annualLast(day);
        await putValues(ss, `Recorrentes!B${r.row}:F${r.row}`, [[desc, cents / 100, category, active, last]]);
        await putValues(ss, `Recorrentes!H${r.row}:J${r.row}`, [[freq, day, fund]]);
        return { id: p.id };
      }
      const id = uuid();
      const last = freq === 'anual' ? annualLast(day) : TODAY_MONTH;
      await appendRows(D, 'Recorrentes', [[id, desc, cents / 100, category, active, last, nowStamp(), freq, day, fund]]);
      return { id };
    }
    case 'deleteRecurring': {
      const r = D.rec.find(x => x.id === p.id); if (!r) throw new Error('Despesa recorrente não encontrada — atualiza a app.');
      await gfetch(`${SHEETS_API}/${ss.id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: ss.sheetIds.Recorrentes, dimension: 'ROWS', startIndex: r.row - 1, endIndex: r.row } } }] }) });
      return { id: r.id };
    }
    case 'setConfig': {
      const key = String(p.key || ''); if (!/^[a-zA-Z]{1,30}$/.test(key)) throw new Error('Definição inválida.');
      const val = String(p.value == null ? '' : p.value).slice(0, 100);
      if (D.cfg[key]) await putValues(ss, `Config!B${D.cfg[key].row}`, [[val]]);
      else await appendRows(D, 'Config', [[key, val]]);
      return {};
    }
    case 'getMonth': return { auto, appColor: D.cfg.corApp ? String(D.cfg.corApp.value) : '',
      month: p.month, budget: D.months[p.month] ? D.months[p.month].budget : D.def, defaultBudget: D.def,
      goal: D.goals[p.month.slice(0, 4)] ? D.goals[p.month.slice(0, 4)].goal : 0,
      expenses: D.exp.filter(e => e.month === p.month), email: ACCOUNT.email };
    case 'addExpenses': {
      const stamp = nowStamp(), out = [];
      const rows = p.items.map(it => {
        const desc = cleanDesc(it.desc); if (!desc) throw new Error('Descrição em falta.');
        const cents = checkCents(it.cents);
        const date = /^\d{4}-\d{2}-\d{2}$/.test(it.date) && it.date.slice(0, 7) === it.month ? it.date : it.month + '-01';
        const e = { id: uuid(), date, month: it.month, desc, cents, category: CAT[it.category] ? it.category : 'Outros' };
        out.push(e);
        return [e.id, e.date, e.month, e.desc, cents / 100, e.category, stamp];
      });
      await appendRows(D, 'Despesas', rows);
      const newMonths = [...new Set(out.map(e => e.month))].filter(m => !D.months[m]);
      if (newMonths.length) await appendRows(D, 'Meses', newMonths.map(m => [m, D.def / 100]));
      return out;
    }
    case 'updateExpense': {
      const e = D.exp.find(x => x.id === p.id); if (!e) throw new Error('Despesa não encontrada — atualiza a app.');
      const desc = cleanDesc(p.desc); if (!desc) throw new Error('Descrição em falta.');
      const cents = checkCents(p.cents), category = CAT[p.category] ? p.category : 'Outros';
      const date = /^\d{4}-\d{2}-\d{2}$/.test(p.date) && p.date.slice(0, 7) === e.month ? p.date : e.date;
      await putValues(ss, `Despesas!B${e.row}:F${e.row}`, [[date, e.month, desc, cents / 100, category]]);
      return { id: e.id, date, month: e.month, desc, cents, category };
    }
    case 'deleteExpense': {
      const e = D.exp.find(x => x.id === p.id); if (!e) throw new Error('Despesa não encontrada — atualiza a app.');
      await gfetch(`${SHEETS_API}/${ss.id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: ss.sheetIds.Despesas, dimension: 'ROWS', startIndex: e.row - 1, endIndex: e.row } } }] }) });
      return { id: e.id };
    }
    case 'setBudget': {
      const m = D.months[p.month];
      if (m) await putValues(ss, `Meses!B${m.row}`, [[p.cents / 100]]);
      else await appendRows(D, 'Meses', [[p.month, p.cents / 100]]);
      if (p.makeDefault) {
        if (D.cfg.orcamentoPadrao) await putValues(ss, `Config!B${D.cfg.orcamentoPadrao.row}`, [[p.cents / 100]]);
        else await appendRows(D, 'Config', [['orcamentoPadrao', p.cents / 100]]);
      }
      return {};
    }
    case 'setGoal': {
      const g = D.goals[String(p.year)];
      if (g) await putValues(ss, `Objetivos!B${g.row}`, [[p.cents / 100]]);
      else await appendRows(D, 'Objetivos', [[p.year, p.cents / 100]]);
      return {};
    }
    case 'getYear': {
      const ex = D.exp.filter(e => e.month.slice(0, 4) === String(p.year)), cats = {}, months = [];
      ex.forEach(e => { cats[e.category] = (cats[e.category] || 0) + e.cents; });
      for (let i = 1; i <= 12; i++){ const m = p.year + '-' + pad(i); months.push({ month: m, budget: D.months[m] ? D.months[m].budget : D.def, salary: D.months[m] ? D.months[m].salary : null, spent: ex.filter(e => e.month === m).reduce((s, e) => s + e.cents, 0), hasData: !!D.months[m] }); }
      const extras = D.extras.filter(e => e.year === String(p.year)).map(({ row, ...e }) => e);
      return { year: p.year, months, extras, categories: cats, goal: D.goals[String(p.year)] ? D.goals[String(p.year)].goal : 0, defaultBudget: D.def, today: TODAY_MONTH };
    }
    case 'setSalary': {
      const val = p.cents == null ? '' : checkCents(p.cents) / 100, m = D.months[p.month];
      if (m) await putValues(ss, `Meses!C${m.row}`, [[val]]);
      else await appendRows(D, 'Meses', [[p.month, D.def / 100, val]]);
      return {};
    }
    case 'saveExtra': {
      const desc = cleanDesc(p.desc); if (!desc) throw new Error('Descrição em falta.');
      const cents = checkCents(p.cents), spent = Math.max(0, Math.round(Number(p.spent) || 0));
      const date = /^\d{4}-\d{2}-\d{2}$/.test(p.date) ? p.date : '';
      const year = date ? date.slice(0, 4) : String(p.year);
      if (p.id){
        const e = D.extras.find(x => x.id === p.id); if (!e) throw new Error('Registo não encontrado — atualiza a app.');
        await putValues(ss, `Extras!B${e.row}:F${e.row}`, [[year, date, desc, cents / 100, spent / 100]]);
        return { id: p.id };
      }
      const id = uuid();
      await appendRows(D, 'Extras', [[id, year, date, desc, cents / 100, spent / 100]]);
      return { id };
    }
    case 'deleteExtra': {
      const e = D.extras.find(x => x.id === p.id); if (!e) throw new Error('Registo não encontrado — atualiza a app.');
      await gfetch(`${SHEETS_API}/${ss.id}:batchUpdate`, { method: 'POST', body: JSON.stringify({ requests: [{ deleteDimension: { range: { sheetId: ss.sheetIds.Extras, dimension: 'ROWS', startIndex: e.row - 1, endIndex: e.row } } }] }) });
      return { id: e.id };
    }
  }
  throw new Error('Ação desconhecida.');
}

async function call(action, p){
  if (REG.blocked) throw new Error('Conta bloqueada.');
  if (DEMO) { await new Promise(r => setTimeout(r, 250)); return Mock(action, p || {}); }
  try { return await api(action, p || {}); }
  catch (e) {
    if (e instanceof AuthError) { showLogin(true); throw new Error('A sessão expirou. Entra de novo.'); }
    throw e;
  }
}

/* ---------- carrossel de cartões (Mês ⇄ Ano ⇄ Fundos), como os cartões de uma app de banco ---------- */
// O cartão atual fica ao centro, com o anterior à esquerda e o seguinte à direita (dá a volta).
const reduceMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const DECK_GAP = 16;
// Mês, Ano, um cartão por fundo e, no fim, o cartão "+" para criar outro fundo
const deckViews = () => ['month', 'year', ...(S.fundsData ? S.fundsData.funds.map(f => 'fund:' + f.id) : []), 'newfund'];
const deckSide = d => { const L = deckViews(), i = Math.max(0, L.indexOf(S.view)); return L[(i + d + L.length) % L.length]; };   // d: -1 anterior, +1 seguinte
function heroFor(view){
  const box = document.createElement('div');
  if (view === 'month' && S.data && S.data.month === S.month) renderMonth(box);
  else if (view === 'year' && S.yearData && S.yearData.year === +S.month.slice(0, 4)) renderYear(box);
  else if (isFundView(view) && (S.fundsData || view === 'newfund')) renderFunds(box, view);
  let h = box.querySelector('.hero');
  if (!h){
    const t = view === 'year' ? 'Guardado em ' + S.month.slice(0, 4) : isFundView(view) ? 'Fundo' : monthLabel(S.month);
    box.innerHTML = `<section class="hero"><div class="hero-top"><span class="eyebrow">${t}</span></div><div class="big" style="opacity:.55">···</div></section>`;
    h = box.firstElementChild;
  }
  return h;
}
function withDots(h, view){
  h.querySelectorAll('.hero-dots').forEach(x => x.remove());
  h.insertAdjacentHTML('beforeend', `<div class="hero-dots" aria-hidden="true">${deckViews().map(v => `<i class="${v === view ? 'on' : ''}"></i>`).join('')}</div>`);
  return h;
}
function buildDeck(){
  const h = $('#view .hero'); if (!h || h.closest('.deck')) return;
  const deck = document.createElement('div'); deck.className = 'deck';
  const track = document.createElement('div'); track.className = 'deck-track';
  const slot = (el, side) => { const s = document.createElement('div'); s.className = 'deck-slot' + (side ? ' side' : ''); s.appendChild(el); return s; };
  h.replaceWith(deck); deck.appendChild(track);
  const a = deckSide(-1), b = deckSide(1);
  track.append(slot(withDots(heroFor(a), a), true), slot(withDots(h, S.view), false), slot(withDots(heroFor(b), b), true));
  deck.style.height = track.children[1].offsetHeight + 'px';
}
function refreshDeckSides(){
  const track = $('#view .deck-track'); if (!track || DRAG.on) return;
  [[0, -1], [2, 1]].forEach(([i, d]) => { const v = deckSide(d); track.children[i].replaceChildren(withDots(heroFor(v), v)); });
}
function switchView(to, dir){
  if (to === S.view) return;
  S.view = to;
  if (to === 'year') S.year = +S.month.slice(0, 4);
  render(); load();   // usa os dados já carregados e atualiza em silêncio
  if (reduceMotion()) return;
  const v = $('#view'); v.classList.remove('view-in-r', 'view-in-l'); void v.offsetWidth;
  const cls = (dir || -1) < 0 ? 'view-in-r' : 'view-in-l';
  v.classList.add(cls);
  clearTimeout(switchView.t); switchView.t = setTimeout(() => v.classList.remove(cls), 520);   // não repetir a animação quando os dados atualizam
}
// depois de uma alteração (despesa, salário, orçamento, subsídio…), volta a ler o Mês e o Ano do Google
// em segundo plano, para que os outros cartões mostrem logo os valores certos
let refreshT = null;
function refreshOthers(){
  clearTimeout(refreshT);
  refreshT = setTimeout(async () => {
    const yr = +S.month.slice(0, 4), month = S.month;
    try {
      const [m, y] = await Promise.all([call('getMonth', { month }), call('getYear', { year: yr })]);
      const sig = d => d ? JSON.stringify([d.budget, d.expenses.map(e => [e.id, e.cents, e.category, e.date, e.desc])]) : '';
      const monthChanged = S.month === month && !hasPending() && sig(m) !== sig(S.data);
      const yearChanged = JSON.stringify(y) !== JSON.stringify(S.yearData);
      if (monthChanged) S.data = m;
      S.yearData = y;
      if (DRAG.on) { DRAG.pending = true; return; }
      if ((S.view === 'year' && yearChanged) || (S.view === 'month' && monthChanged)) render(); else refreshDeckSides();
    } catch (e) {}
  }, 350);
}
const hasPending = () => !!(S.data && S.data.expenses.some(e => e.pending));
// carrega o ano e os fundos em segundo plano para os cartões do lado já mostrarem os números
let prefetching = false;
async function prefetchYear(){
  const yr = +S.month.slice(0, 4);
  if (prefetching) return;
  prefetching = true;
  try {
    if (!S.yearData || S.yearData.year !== yr){ const d = await call('getYear', { year: yr }); if (!S.yearData || S.yearData.year !== yr || S.view !== 'year') S.yearData = d; }
    if (!S.fundsData){ const f = await call('getFunds', { year: yr }); if (!S.fundsData) S.fundsData = f; }
    if (deckViews().includes(S.view)) refreshDeckSides();
  } catch (e) {} finally { prefetching = false; }
}
const DRAG = { on:false };
(() => {
  const view = document.getElementById('view');
  const spring = 'cubic-bezier(.2,.9,.25,1)';
  let sx, sy, t0, dx, mode, deck, track, w, hCur, hL, hR, lastX, lastT, vel;
  const setP = (p, dk = deck) => {   // p: 0 (cartão atual) → 1 (cartão do lado para onde se arrasta)
    const cur = track.children[1].firstElementChild, a = track.children[0].firstElementChild, b = track.children[2].firstElementChild;
    cur.style.transform = `scale(${1 - .06 * p})`; cur.style.opacity = String(1 - .25 * p);
    [a, b].forEach(x => { x.style.transform = `scale(${.94 + .06 * p})`; x.style.opacity = String(.75 + .25 * p); });
    const hOther = dx < 0 ? hR : hL;
    dk.style.height = (hCur + (hOther - hCur) * p) + 'px';
  };
  view.addEventListener('touchstart', ev => {
    deck = ev.touches.length === 1 && deckViews().includes(S.view) ? ev.target.closest('.deck') : null;
    if (!deck) return;
    track = deck.firstElementChild; w = track.clientWidth;
    hCur = track.children[1].offsetHeight; hL = track.children[0].offsetHeight; hR = track.children[2].offsetHeight;
    sx = lastX = ev.touches[0].clientX; sy = ev.touches[0].clientY; t0 = lastT = performance.now(); dx = 0; vel = 0; mode = null;
    track.style.transition = 'none'; deck.style.transition = 'none';
    track.querySelectorAll('.hero').forEach(x => { x.style.transition = 'none'; });
  }, { passive: true });
  view.addEventListener('touchmove', ev => {
    if (!deck) return;
    const t = ev.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
    if (!mode){ if (Math.abs(mx) < 6 && Math.abs(my) < 6) return; mode = Math.abs(mx) > Math.abs(my) ? 'x' : 'y'; if (mode === 'x') DRAG.on = true; }
    if (mode !== 'x') return;
    const now = performance.now(); vel = (t.clientX - lastX) / Math.max(1, now - lastT); lastX = t.clientX; lastT = now;
    const max = w + DECK_GAP;
    dx = Math.abs(mx) > max ? Math.sign(mx) * (max + (Math.abs(mx) - max) * .3) : mx;   // resistência no fim
    track.style.transform = `translateX(calc(-100% - ${DECK_GAP}px + ${dx}px))`;
    setP(Math.min(1, Math.abs(dx) / max));
  }, { passive: true });
  const end = () => {
    if (!deck) return;
    const d = deck; deck = null; DRAG.on = false;
    if (mode !== 'x') return;
    const max = w + DECK_GAP, go = Math.abs(dx) > w * .22 || (Math.abs(vel) > .35 && Math.abs(dx) > 24 && Math.sign(vel) === Math.sign(dx));
    const dur = reduceMotion() ? 0 : Math.round(Math.max(.26, Math.min(.5, (go ? max - Math.abs(dx) : Math.abs(dx)) / max * .5 + .18)) * 1000);
    const tr = `transform ${dur}ms ${spring}`;
    track.style.transition = tr; d.style.transition = `height ${dur}ms ${spring}`;
    track.querySelectorAll('.hero').forEach(x => { x.style.transition = `${tr}, opacity ${dur}ms ease`; });
    if (go){
      const dir = dx < 0 ? -1 : 1;
      track.style.transform = `translateX(calc(-100% - ${DECK_GAP}px + ${dir * max}px))`;
      setP(1, d);
      setTimeout(() => switchView(deckSide(-dir), dir), dur);   // arrastar para a esquerda → cartão seguinte
    } else {
      track.style.transform = `translateX(calc(-100% - ${DECK_GAP}px))`;
      setP(0, d);
      if (DRAG.pending) setTimeout(render, dur);
    }
  };
  view.addEventListener('touchend', end, { passive: true });
  view.addEventListener('touchcancel', end, { passive: true });
})();
function skeleton(){
  $('#view').innerHTML = `<div class="sk" style="height:206px;border-radius:26px"></div><div class="sk" style="height:96px"></div><div class="sk" style="height:260px"></div>`;
}

function monthTotals(){
  const d = S.data, sim = S.sim;
  const rows = d.expenses.map(e => Object.assign({}, e, { off: sim.on && sim.off.has(e.id) }));
  const extra = sim.on ? sim.extra : [];
  const spent = rows.filter(r => !r.off).reduce((s, e) => s + e.cents, 0) + extra.reduce((s, e) => s + e.cents, 0);
  return { rows, extra, spent, budget: d.budget, left: d.budget - spent };
}

function renderMonth(target){
  const { rows, extra, spent, budget, left } = monthTotals();

  (target || $('#view')).innerHTML = `

      <div style="min-width:0"><div class="big num">${eurBig(left)}</div>
        <div class="hero-sub num">${availBp < 0 ? 'Excedido em ' + pct(-availBp) : pct(availBp) + ' disponível'}</div></div>

// Contas do ano, como na tabela "Geral": Guardar = salário − orçamento; Sobrou = orçamento − gasto;
// Guardado = Guardar + Sobrou; Total = soma dos meses fechados. Subsídios (valor − gasto) somam ao total.
function ledger(y){
  const today = y.today;
  let total = 0; const rows = [];
  y.months.forEach(m => {
    const closed = m.month < today, cur = m.month === today;
    const show = (closed && (m.hasData || m.salary != null)) || cur;   // só até ao mês atual
    if (!show) return;
    const guardar = m.salary != null ? m.salary - m.budget : 0;
    const sobrou = m.month > today ? 0 : m.budget - m.spent;
    const guardado = guardar + sobrou;
    if (closed) total += guardado;
    rows.push(Object.assign({}, m, { closed, cur, future: m.month > today, guardar, sobrou, guardado, total: closed ? total : null }));
  });
  const extras = y.extras || [];
  const extraNet = extras.reduce((s, e) => s + e.cents - e.spent, 0);
  const monthsLeft = y.months.filter(m => m.month >= today).length;
  return { rows, closedTotal: total, extraNet, saved: total + extraNet, cur: rows.find(r => r.cur), monthsLeft };
}

function renderYear(target){
  const y = S.yearData, today = y.today, goal = y.goal;
  let spentYear = 0, withData = 0;
  y.months.forEach(m => { spentYear += m.spent; if (m.hasData && m.month <= today) withData++; });
  const avg = withData ? Math.round(spentYear / withData) : 0;
  const L = ledger(y), saved = L.saved, cur = L.cur;

  let hero, advice = '';
  if (goal){
    const bp = Math.round(Math.max(0, saved) * 10000 / goal);
    const missing = goal - saved;
    const need = L.monthsLeft > 0 && missing > 0 ? Math.ceil(missing / L.monthsLeft) : 0;
    hero = `<section class="hero ${saved < 0 ? 'neg' : ''}">
      <div class="hero-top"><span class="eyebrow">Guardado em ${y.year}</span><button class="chip-w" data-act="settings">Editar objetivo</button></div>
      <div class="hero-main"><div style="min-width:0"><div class="big num">${eurBig(saved)}</div>
        <div class="hero-sub num">${missing <= 0 ? 'Objetivo cumprido' : 'Faltam ' + eur(missing)}</div></div>
        ${ring(bp / 10000, Math.min(999, Math.round(bp / 100)) + '%', 'do objetivo')}</div>
      <div class="stats"><div class="stat"><small>Objetivo</small><b class="num">${eur(goal).replace(/,00 €$/, ' €')}</b></div>
        ${cur ?`<div class="stat"><small>Este mês</small><b class="num">${eur(cur.guardado)}</b></div>` : ''}
        ${need ? `<div class="stat"><small>Precisas/mês</small><b class="num">${eur(need)}</b></div>` : ''}</div>
    </section>`;
    let msg = '';
    if (missing <= 0) msg = `<b>Objetivo cumprido.</b> Tudo o que guardares a partir daqui é extra.`;
    else if (cur && cur.salary == null) msg = `Adiciona o salário de <b>${MESES[+today.slice(5) - 1].toLowerCase()}</b> em "Mês a mês" para veres quanto vais guardar este mês.`;
    else if (cur && cur.guardado >= missing) msg = `Se acabares o mês assim, guardas <b>${eur(cur.guardado)}</b> e <b>chegas ao objetivo</b> já este mês.`;
    else if (cur) msg = cur.guardado >= need
      ? `Este mês vais guardar <b>${eur(cur.guardado)}</b>, acima dos ${eur(need)} por mês de que precisas.`
      : `Este mês vais guardar <b>${eur(cur.guardado)}</b>. Para o objetivo precisas de <b>${eur(need)}</b> por mês.`;
    else if (need) msg = `Para chegar ao objetivo precisas de guardar <b>${eur(need)}</b> por mês.`;
    if (msg) advice = `<section class="card advice">${icon(missing <= 0 || (cur && cur.guardado >= need) ? 'Lazer' : 'Subscrições')}<p>${msg}</p></section>`;
  } else {
    hero = `<section class="hero"><div class="hero-top"><span class="eyebrow">Objetivo anual</span></div>
      <div class="big" style="font-size:24px;margin-top:8px;white-space:normal">Quanto queres poupar em ${y.year}?</div>
      <div class="hero-sub">A app calcula quanto podes gastar por mês para lá chegar.</div>
      <div class="stats"><button class="stat tap" data-act="settings" style="text-align:left;color:#fff"><small>Começar</small><b>Definir objetivo →</b></button></div></section>`;
  }

  const max = Math.max(1, y.defaultBudget, ...y.months.map(m => m.spent));
  const bars = y.months.map(m => `<button class="bar-col ${m.month === today ? 'cur' : ''} ${m.hasData && m.spent > m.budget ? 'over' : ''} ${m.hasData ? '' : 'nodata'}" data-month="${m.month}" aria-label="${MESES[+m.month.slice(5) - 1]}: ${eur(m.spent)}"><i style="height:${(m.spent * 100 / max).toFixed(1)}%"></i></button>`).join('');
  const labels = y.months.map((m, i) => `<span class="${m.month === today ? 'cur' : ''}">${'JFMAMJJASOND'[i]}</span>`).join('');

  const cats = Object.entries(y.categories).filter(c => c[1] > 0).sort((a, b) => b[1] - a[1]);
  const maxC = cats.length ? cats[0][1] : 1;
  const catsHtml = cats.length ? cats.map(([k, v]) => `<div class="crow" style="--c:${CAT[k] ? CAT[k].c : '#888'}">${icon(k, 'sm')}<div class="crow-main">
      <div class="crow-h"><span>${esc(k)}<small>${pct(Math.round(v * 10000 / spentYear))}</small></span><span class="num">${eur(v)}</span></div>
      <div class="track"><i style="width:${(v * 100 / maxC).toFixed(1)}%"></i></div></div></div>`).join('') : `<p class="hint">Sem despesas neste ano.</p>`;

  const ledgerHtml = L.rows.map(r => `
    <button class="mrow ${r.cur ? 'cur' : ''} ${r.future && r.salary == null ? 'muted' : ''}" data-sal="${r.month}">
      <span><b>${MESES[+r.month.slice(5) - 1]}</b><small class="s num">${r.salary != null ? 'Salário ' + eur(r.salary) : 'Toca para pôr o salário'}</small></span>
      <span class="r num">${r.future ? (r.salary != null ? `<b>${eur(r.guardar)}</b><small class="s">a guardar</small>` : '') : `<b class="${r.guardado < 0 ? 'neg' : ''}">${eur(r.guardado)}</b><small class="s">${r.closed ? 'total ' + eur(r.total) : 'previsto'}</small>`}</span>
    </button>`).join('');
  const extras = y.extras || [];
  const extrasHtml = extras.map(e => `
    <button class="mrow" data-extra="${esc(e.id)}"><span><b>${esc(e.desc)}</b><small class="s">${e.date ? fmtDate(e.date) : ''}${e.spent ? (e.date ? ' · ' : '') + 'gasto ' + eur(e.spent) : ''}</small></span>
      <span class="r num"><b>${eur(e.cents - e.spent)}</b><small class="s">de ${eur(e.cents)}</small></span></button>`).join('');

  (target || $('#view')).innerHTML = `
  ${hero}
  ${advice}
  <section class="card"><div class="card-h"><h3>Mês a mês</h3><span class="hint" style="margin:0">Guardado</span></div>${ledgerHtml || '<p class="hint">Sem meses neste ano.</p>'}</section>
  <section class="card"><div class="card-h"><h3>Subsídios e extras</h3><button data-act="addExtra">Adicionar</button></div>
    ${extrasHtml || '<p class="hint">Subsídio de férias, de Natal ou outros valores extra. Contam para o objetivo.</p>'}</section>
  <section class="card">
    <h3>Gasto por mês</h3>
    <div class="bars-wrap">${bars}<div class="budget-line" style="bottom:${(y.defaultBudget * 100 / max).toFixed(1)}%"><span class="num">${eur(y.defaultBudget)}</span></div></div>
    <div class="bar-labels">${labels}</div>
    <div class="crow-h" style="margin-top:14px;color:var(--muted)"><span>Média mensal</span><span class="num" style="color:var(--ink)">${eur(avg)}</span></div>
  </section>
  <section class="card"><h3>Onde vai o dinheiro</h3>${catsHtml}</section>`;
}

/* ============================== folha inferior ============================== */
let lockY = null;
function lockBody(){
  if (lockY != null) return;
  lockY = window.scrollY;
  document.body.style.top = -lockY + 'px';
  document.body.classList.add('sheet-lock');
}
function unlockBody(){
  if (lockY == null) return;
  document.body.classList.remove('sheet-lock'); document.body.style.top = '';
  window.scrollTo(0, lockY); lockY = null;
}
function openSheet(html){
  const sh = $('#sheet');
  sh.innerHTML = '<div class="grab"></div>' + html; sh.scrollTop = 0;
  // campos de valores: usam o teclado da app (o mesmo da nova despesa) em vez do teclado do telemóvel
  const kps = sh.querySelectorAll('[data-kpf]');
  KP = null;
  if (kps.length){
    sh.insertAdjacentHTML('beforeend', `<div class="keypad kp-pad">${['1','2','3','4','5','6','7','8','9',',','0','del'].map(k => `<button class="key" data-kp="${k}" aria-label="${k === 'del' ? 'Apagar' : k}">${k === 'del' ? '<svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>' : k}</button>`).join('')}</div>`);
    kpActivate(kps[0]);
  }
  lockBody(); $('#scrim').classList.add('open'); void sh.offsetWidth; sh.classList.add('open');
}
let KP = null;   // campo de valor ativo
const kpFormat = raw => { const [i, d] = raw.split(','); const ii = (i || '').replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.'); return d != null ? (ii || '0') + ',' + d : ii; };
function kpActivate(inp){
  document.querySelectorAll('[data-kpf]').forEach(x => x.classList.toggle('kp-on', x === inp));
  KP = inp; inp.dataset.raw = inp.value.replace(/\./g, '');
  inp.classList.toggle('fresh', !!inp.value);   // o primeiro número substitui o valor que lá está
}
function kpPress(k){
  if (!KP || !KP.isConnected) return;
  let raw = KP.dataset.raw || '';
  if (KP.classList.contains('fresh')){ KP.classList.remove('fresh'); if (k !== 'del') raw = ''; }
  if (k === 'del') raw = raw.slice(0, -1);
  else if (k === ','){ if (!raw.includes(',')) raw = (raw || '0') + ','; }
  else {
    if (raw.includes(',') && raw.split(',')[1].length >= 2) return;
    if (raw.replace(',', '').length >= 9) return;
    raw += k;
  }
  KP.dataset.raw = raw; KP.value = kpFormat(raw); buzz();
  KP.dispatchEvent(new Event('input', { bubbles: true }));
}
function closeSheet(){ if (F && F.mode === 'settings' && !F.saved && F.color !== F.colorOrig) applyAppColor(F.colorOrig); $('#sheet').classList.remove('open'); $('#scrim').classList.remove('open'); unlockBody(); F = null; }

let F = null;   // formulário aberto
function defaultDate(){ return S.month === TODAY_MONTH ? TODAY : S.month + '-01'; }
function monthBounds(){ const [Y, M] = S.month.split('-').map(Number); return [S.month + '-01', S.month + '-' + pad(new Date(Y, M, 0).getDate())]; }

function openForm(mode, e){
